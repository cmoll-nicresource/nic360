name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nic360_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec vitest run src/lib/writeDatasetRows.integration.test.ts src/lib/emailFlagSchema.integration.test.ts src/lib/ses/newsletter.integration.test.ts
        env:
          DATASET_INTEGRATION: '1'
          NEWSLETTER_INTEGRATION: '1'
          PAYLOAD_SECRET: 'ci-only-nic360-test-secret-not-a-live-secret'
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/nic360_test
      - run: pnpm exec vitest run src/lib/operations/monitor.integration.test.ts
        env:
          OPERATIONS_INTEGRATION: '1'
          PAYLOAD_SECRET: 'ci-only-nic360-test-secret-not-a-live-secret'
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/nic360_test
